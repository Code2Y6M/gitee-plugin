id = "code2y6m.gitee-plugin"
name = "Gitee"
version = "1.1.1"
description = "Integrates Gitee (码云) into OpenIDEA: browse and manage pull requests and issues, review changes, clone and push, and hand Gitee to the AI agent — all from the editor."
authors = ["Key"]
homepage = "https://github.com/Code2Y6M/gitee-plugin"
license = "Apache-2.0"
change-notes = "1.1.1 — Gitee appears in Get from VCS › Clone Repository: its pane searches the token's repositories and fills in the clone URL (HTTPS or SSH). This build fixes the pane's failure state (a missing token or a network error now disables the controls it cannot use and keeps its labels), puts the private badge next to the name and draws the refresh button as an icon. Needs plugin API 1.15; 1.0.3 stays for earlier IDEs."
categories = ["vcs"]
icon = "icon.svg"
engines.openidea = "^1.15"
wasm = "dist/plugin.wasm"

# Wake up on schedule (periodic PR/Issue refresh), when a project's VCS state
# changes (so the status bar follows the focused repository), and when any of
# the plugin's commands run.
activation = ["on-schedule:300", "on-event:vcs-changed", "on-event:editor-focused", "on-command:*"]

[capabilities]
required = ["project.read", "vcs.read", "vcs.write", "events", "net:gitee.com", "process:git"]
optional = ["secrets"]

[[contributes.commands]]
id = "show-panel"
title = "Gitee: Open Repositories Panel"
category = "Gitee"

[[contributes.commands]]
id = "commands"
title = "Gitee: All Commands"
category = "Gitee"

[[contributes.commands]]
id = "prs"
title = "Gitee: List Pull Requests"
